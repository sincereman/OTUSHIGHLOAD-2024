- name: Borg init Repo
  shell: |
      ssh-keyscan -H 10.200.0.220 >> ~/.ssh/known_hosts
      borg init --encryption=none borg@10.200.0.220:/var/backup/{hostname}/
      exit 0
  tags:
    - borginit
  notify:
    - restartborgbackup
