---

# Install BorgBackup
 
- name: Install borgbackup
  apt:
    name: "borgbackup"
    state: present
    update_cache: yes
  become: true
  tags:
    - dataserver
    - borgbackup


# Create SSH Key for borg users

# - name: Create a 2048-bit SSH key for user root in ~root/.ssh/id_rsa
#   ansible.builtin.user:
#     name: root
#     generate_ssh_key: yes
#     ssh_key_bits: 2048
#     ssh_key_file: .ssh/id_rsa_borg


- name: Copy publickey for borg
  template: 
    src: "files/id_rsa.pub"
    dest: ~root/.ssh/
    mode: '0600'
  tags:
    - dataserverborgconfig
    - dataserverprivatekey

- name: Copy privatekey for borg
  template: 
    src: "files/id_rsa"
    dest: ~root/.ssh/
    mode: '0600'
  tags:
    - dataserverborgconfig
    - dataserverprivatekey


#Create config for borg

- name: Config for borg
  template: 
    src: "files/borg-backup-frontend.sh"
    dest: /etc/borg-backup.sh
    owner: "{{ borg_user }}"
    group: "{{ borg_group }}"
    mode: '0755'
  tags:
    - dataserverborgconfig
    - dataserver
  when: "'frontend' in group_names"


- name: Config for borg
  template: 
    src: "files/borg-backup-nodesweb.sh"
    dest: /etc/borg-backup.sh
    owner: "{{ borg_user }}"
    group: "{{ borg_group }}"
    mode: '0755'
  tags:
    - dataserverborgconfig
    - dataserver
  when: "'nodesweb' in group_names"

- name: Config for borg
  template: 
    src: "files/borg-backup-nodesdb.sh"
    dest: /etc/borg-backup.sh
    owner: "{{ borg_user }}"
    group: "{{ borg_group }}"
    mode: '0755'
  tags:
    - dataserverborgconfig
    - dataserver
  when: "'nodesdb' in group_names"

#

- name: Add Borg Service config
  template: 
    src: "files/borg-backup.service"
    dest: /etc/systemd/system
    owner: "{{ borg_user }}"
    group: "{{ borg_group }}"
    mode: '0755'
  tags:
    - dataserverborgconfig
    - dataserver
  
- name: Add Borg Service timer
  template: 
    src: "files/borg-backup.timer"
    dest: /etc/systemd/system
    owner: "{{ borg_user }}"
    group: "{{ borg_group }}"
    mode: '0755'
  tags:
    - dataserverborgconfig
    - dataserver
    - recovery    
  notify:
    - systemctl daemon reload


#install borg-backup

- name: borg-backup
  service:
    name: borg-backup
    enabled: yes
    state: started
  notify:
    - systemctl daemon reload


- name: reload systemctl
  command: systemctl daemon-reload
  tags: recovery

- name: borg-backup.timer
  service:
    name: borg-backup.timer
    enabled: yes
    state: started
  notify:
    - systemctl daemon reload
  tags: recovery

