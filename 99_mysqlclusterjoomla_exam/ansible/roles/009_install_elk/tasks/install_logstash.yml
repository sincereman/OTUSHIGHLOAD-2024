- name: Copy elastic-configuration file.
  template:
    src: "templates/logstash_itself.conf.j2"
    dest: /etc/logstash/conf.d/logstash_itself.conf
    owner: root
    group: logstash
    mode: 0660
  become: true
  notify:
    - restart logstash

- name: Copy elastic-configuration file.
  template:
    src: "templates/logstash_nginx.conf.j2"
    dest: /etc/logstash/conf.d/nginx.conf
    owner: root
    group: logstash
    mode: 0660
  become: true
  notify:
    - restart logstash


- meta: flush_handlers