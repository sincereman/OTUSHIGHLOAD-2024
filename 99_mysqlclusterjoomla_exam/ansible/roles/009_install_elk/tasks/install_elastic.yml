---

- name: "Install gnupg"
  ansible.builtin.apt:
    name: gnupg2
    update_cache: yes

- name: "Install apt-transport-https"
  ansible.builtin.apt:
    name: apt-transport-https
    update_cache: yes

- name: Adds repository key
  apt_key:
    url: http://elasticrepo.serveradmin.ru/elastic.asc
    state: present

- name: Adds elastic alter repositories
  apt_repository:
    repo: 'deb http://elasticrepo.serveradmin.ru bookworm main'
    state: present

- name: Installs elastic
  apt:
    pkg: "{{ item }}"
    state: present
  with_items:
    - elasticsearch

- name: restart elastic
  systemd:
    name: elasticsearch
    state: restarted
    enabled: yes


#set_elastic_config


- name: Copy elastic-configuration file.
  template:
    src: "templates/elasticsearch.yml.j2"
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: elasticsearch
    mode: 0660
  become: true
  notify:
    - restart elastic

- name: Copy jvm-elastic-configuration file.
  template:
    src: "templates/jvm_mem.options.j2"
    dest: /etc/elasticsearch/jvm.options.d/mem.options
    owner: root
    group: elasticsearch
    mode: 0660
  become: true    
  notify:
    - restart elastic

# set elastic password 

- name: Reset elastic user password to random
  ansible.builtin.command: /usr/share/elasticsearch/bin/elasticsearch-reset-password -u elastic -b
  register: reset_cmd
  tags: passwordresetelastic

- name: Push password
  vars:
    my_tempelastic_password: "{{ reset_cmd.stdout_lines[-1]
      | regex_replace('^New value: (.*)$', '\\1') }}"
  ansible.builtin.uri:
    url: https://localhost:9200/_security/user/elastic/_password
    method: PUT
    url_username: elastic
    url_password: "{{ my_tempelastic_password}}"
    validate_certs: false
    body_format: json
    body:
      password: "{{ elastic_password }}"
    headers:
      Content-Type: "application/json"      
  tags: passwordresetelastic