- name: Copy nftables-configuration file for frontend.
  template:
    src: "templates/nftables_frontend.conf.j2"
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: 0744
  become: true
  notify:
    - restart nftables
  when: "'frontend' in group_names"


- name: Copy filebeat-configuration file for nodesdb .
  template:
    src: "templates/nftables_nodesdb.conf.j2"
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: 0744
  become: true
  notify:
    - restart nftables
  when: "'nodesdb' in group_names"

- name: restart nftables
  systemd:
    name: nftables
    state: restarted
    enabled: yes
