---

- name: Installs nftables
  apt:
    pkg: "{{ item }}"
    state: present
  with_items:
    - nftables



- name: Enable NFTables
  service:
    name: nftables
    enabled: yes
    state: started
  notify:
    - systemctl daemon reload
  tags:
    - nftables



