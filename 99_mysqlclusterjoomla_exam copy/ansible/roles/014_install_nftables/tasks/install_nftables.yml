- name: Copy nftables-configuration file for nodesweb.
  template:
    src: "templates/nftables_nodesweb.conf.j2"
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: 0744
  become: true
  notify:
    - restart nftables
  when: "'nodesweb' in group_names"

